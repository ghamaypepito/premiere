<title>Premier Site Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --navy-900:#142948;--navy-700:#193153;--navy-500:#2C4570;--navy-300:#8FA6C9;
  --gold:#F2AF11;--gold-300:#FFCE60;
  --paper:#FBFAF9;--mist:#F0F3F8;--surface:#FFFFFF;
  --ink:#14181F;--ink-2:#4A5261;--ink-3:#79818F;--rule:#E1E6EE;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1524;--mist:#111D33;--surface:#132038;
    --ink:#EDF1F7;--ink-2:#AFBDD2;--ink-3:#808FA6;--rule:#213048;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1524;--mist:#111D33;--surface:#132038;
  --ink:#EDF1F7;--ink-2:#AFBDD2;--ink-3:#808FA6;--rule:#213048;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
@media (max-width:720px){.wrap{padding:0 22px}}
h1,h2,h3,.disp{font-family:Newsreader,Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.02em;margin:0}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.lede{font-size:18px;line-height:1.6;max-width:62ch;margin:0}
.small{font-size:14.5px;line-height:1.6;color:var(--ink-2);margin:0}
.mark{color:var(--ink-3);font-size:12.5px}

/* header */
header{position:fixed;inset:0 0 auto;z-index:60;background:rgba(20,41,72,0);backdrop-filter:blur(0px);transition:background .28s ease-out,backdrop-filter .28s ease-out;border-bottom:1px solid rgba(255,255,255,0)}
header.solid{background:rgba(20,41,72,.94);backdrop-filter:blur(10px);border-bottom-color:rgba(143,166,201,.18)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:28px;height:84px}
.nav img{width:186px;height:auto;cursor:pointer}
.menu{display:flex;align-items:center;gap:26px}
@media (max-width:1120px){.menu{display:none}}
.menu a{color:#fff;font-size:12.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;position:relative;padding:4px 0}
.menu a:after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--gold);transform:scaleX(0);transform-origin:left center;transition:transform .22s var(--ease)}
.menu a:hover:after,.menu a[aria-current="page"]:after{transform:scaleX(1)}
.menu a[aria-current="page"]{color:var(--gold)}
.burger{display:none;flex-direction:column;gap:5px;width:26px;background:none;border:0;cursor:pointer;padding:6px 0}
.burger span{height:2px;background:#fff;display:block}
@media (max-width:1120px){.burger{display:flex}}
.drawer{display:none;background:var(--navy-900);padding:8px 0 22px}
.drawer.open{display:block}
.drawer a{display:block;color:#fff;text-decoration:none;font-size:14px;padding:13px 0;border-bottom:1px solid rgba(143,166,201,.16);letter-spacing:.04em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:Poppins,sans-serif;font-size:13.5px;font-weight:600;min-height:50px;padding:0 26px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:background .16s ease-out,color .16s ease-out,border-color .16s ease-out,transform .13s var(--ease)}
.btn:active{transform:scale(.972)}
.btn-p{background:var(--gold);color:#193153}
.btn-p:hover{background:var(--gold-300)}
.btn-onnavy{border-color:rgba(143,166,201,.6);color:#fff}
.btn-onnavy:hover{border-color:#fff}
.btn-s{border-color:var(--navy-700);color:var(--navy-700)}
.btn-s:hover{background:var(--navy-700);color:#fff}
:root[data-theme="dark"] .btn-s{border-color:var(--navy-300);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-s{border-color:var(--navy-300);color:var(--ink)}}
.nav .btn{min-height:44px;padding:0 20px;font-size:12px;letter-spacing:.05em;text-transform:uppercase}

/* routing */
.page{display:none}
.page.active{display:block}

/* hero */
.hero{position:relative;min-height:clamp(580px,86vh,880px);display:flex;align-items:flex-end;overflow:hidden;background:var(--navy-900)}
.hero video,.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .veil{position:absolute;inset:0;background:linear-gradient(100deg,rgba(20,41,72,.86) 0%,rgba(20,41,72,.58) 46%,rgba(20,41,72,.34) 100%)}
.hero .foot{position:absolute;inset:auto 0 0;height:52%;background:linear-gradient(to top,rgba(12,20,36,.92),rgba(12,20,36,0))}
.hero .wrap{position:relative;z-index:2;padding-bottom:82px;padding-top:150px;width:100%}
.hero h1{color:#fff;font-size:clamp(40px,5.6vw,80px);line-height:1.02;max-width:17ch}
.hero h1 .l{display:block}
.hero .eyebrow{color:var(--gold);margin-bottom:22px}
.hero p{color:#D6DEEA;font-size:clamp(16px,1.5vw,19px);max-width:56ch;margin:24px 0 0}
.hero .cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px}
.scrollcue{position:absolute;left:40px;bottom:26px;z-index:2;font-size:10.5px;letter-spacing:.22em;color:var(--navy-300);text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:10px}
.scrollcue i{display:block;width:34px;height:1px;background:var(--navy-300);transform-origin:left;animation:cue 2.6s var(--ease) infinite}
@media (max-width:720px){.scrollcue{display:none}}
@keyframes cue{0%,100%{transform:scaleX(.35);opacity:.5}50%{transform:scaleX(1);opacity:1}}

/* page hero */
.phero{background:var(--navy-700);padding:172px 0 84px;position:relative;overflow:hidden}
.phero.img:before{content:"";position:absolute;inset:0;background-image:var(--bg);background-size:cover;background-position:center;opacity:.28}
.phero.img:after{content:"";position:absolute;inset:0;background:linear-gradient(95deg,rgba(25,49,83,.94),rgba(25,49,83,.62))}
.phero .wrap{position:relative;z-index:2}
.crumb{font-size:12.5px;color:var(--navy-300);margin-bottom:20px}
.crumb a{color:var(--navy-300);text-decoration:none}
.crumb a:hover{color:#fff}
.crumb b{color:var(--gold);font-weight:500}
.phero h1{color:#fff;font-size:clamp(34px,4.6vw,60px);line-height:1.06;max-width:19ch}
.phero p{color:#C9D5E6;font-size:clamp(16px,1.5vw,18.5px);max-width:58ch;margin:22px 0 0}
.phero .cta{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}

section{padding:104px 0}
@media (max-width:720px){section{padding:64px 0}}
section.tight{padding:72px 0}
.on-navy{background:var(--navy-700);color:#fff}
.on-mist{background:var(--mist)}
.sec-label{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.sec-label .eyebrow{color:var(--ink-3)}
.on-navy .sec-label .eyebrow{color:var(--gold)}
.sec-label:before{content:"";width:26px;height:1.5px;background:var(--gold);flex:none}
.h-sec{font-size:clamp(28px,3.2vw,42px);line-height:1.13;text-wrap:balance;max-width:24ch}
.on-navy .h-sec{color:#fff}

/* stakes / two-col */
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:64px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr);gap:32px}}
.two.mid{align-items:center}
.num{color:var(--gold)}
.cite{font-size:12px;color:var(--ink-3);margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}

/* quotes */
.quotes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
@media (max-width:1000px){.quotes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.quotes{grid-template-columns:minmax(0,1fr)}}
.quote{background:var(--paper);padding:34px 28px 30px;display:flex;flex-direction:column;gap:16px;transition:background .2s ease-out}
.quote:hover{background:var(--surface)}
.quote .mk{font-family:Newsreader,serif;font-size:44px;line-height:.4;color:var(--gold);height:20px}
.quote p{font-family:Newsreader,Georgia,serif;font-size:19.5px;line-height:1.42;margin:0;color:var(--ink)}

/* practices */
.practices{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:26px}
@media (max-width:950px){.practices{grid-template-columns:minmax(0,1fr)}}
.flagship{position:relative;overflow:hidden;background:var(--navy-700);min-height:470px;display:flex;align-items:flex-end;text-decoration:none}
.flagship img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;transition:transform 1.1s var(--ease),opacity .4s ease-out}
.flagship:hover img{transform:scale(1.045);opacity:.58}
.flagship .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,41,72,.97) 22%,rgba(20,41,72,.42))}
.flagship .in{position:relative;z-index:2;padding:40px;display:flex;flex-direction:column;gap:15px}
.flagship h3{color:#fff;font-size:clamp(28px,3vw,38px);line-height:1.08}
.flagship p{color:#C9D5E6;max-width:44ch;margin:0;font-size:16px}
.side{display:flex;flex-direction:column;gap:26px}
.card{background:var(--surface);border:1px solid var(--rule);padding:26px;display:flex;flex-direction:column;gap:11px;flex:1;justify-content:center;transition:border-color .2s ease-out,transform .28s var(--ease);text-decoration:none;color:inherit}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.card h3{font-size:21px;line-height:1.2}
.card p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.55}
.golink{display:inline-flex;align-items:center;gap:9px;color:var(--gold);font-family:Poppins,sans-serif;font-size:13.5px;font-weight:600;text-decoration:none;margin-top:6px}
.golink i{display:block;width:16px;height:1.5px;background:var(--gold);transition:width .24s var(--ease)}
.flagship:hover .golink i,.golink:hover i{width:30px}

/* method */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 40px;margin-top:14px}
@media (max-width:900px){.steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 28px}}
@media (max-width:600px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{display:flex;flex-direction:column;gap:11px;padding-top:22px;position:relative}
.step:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left center;transition:transform .48s var(--ease)}
.step.lit:before{transform:scaleX(1)}
.step .n{font-family:Newsreader,serif;font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums}
.step h3{color:#fff;font-size:25px}
.step p{color:#A9B8CE;font-size:14.5px;line-height:1.58;margin:0}

/* timeline rows */
.trow{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1.25fr);gap:36px;padding:30px 0;border-top:1px solid var(--rule);align-items:start}
.on-navy .trow{border-top-color:var(--navy-500)}
@media (max-width:800px){.trow{grid-template-columns:56px minmax(0,1fr);gap:18px}.trow .tbody{grid-column:2}}
.trow .tn{font-family:Newsreader,serif;font-size:34px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.trow h3{font-size:23px}
.on-navy .trow h3{color:#fff}
.trow .dur{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:7px;display:block}
.on-navy .trow .dur{color:var(--navy-300)}
.trow p{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2)}
.on-navy .trow p{color:#A9B8CE}

/* answer block */
.answer{background:var(--surface);border-left:3px solid var(--gold);padding:38px 40px}
@media (max-width:720px){.answer{padding:28px 24px}}
.answer h2{font-size:clamp(24px,2.6vw,31px);line-height:1.2;margin-bottom:18px}
.answer p{font-family:Newsreader,Georgia,serif;font-size:clamp(17px,1.8vw,20.5px);line-height:1.58;margin:0;color:var(--ink);max-width:72ch}

/* list */
.dlist{display:flex;flex-direction:column}
.dlist div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:14px;padding:15px 0;border-bottom:1px solid var(--rule);font-size:15.5px;line-height:1.5}
.dlist div:first-child{border-top:1px solid var(--rule)}
.dlist b{color:var(--gold)}

/* faq */
.faq{border-top:1px solid var(--rule)}
.faq details{border-bottom:1px solid var(--rule)}
.faq summary{list-style:none;cursor:pointer;padding:24px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;font-size:clamp(17px,1.8vw,20px);font-family:Newsreader,Georgia,serif;line-height:1.32}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{flex:none;width:15px;height:15px;position:relative;transition:transform .32s var(--ease)}
.faq summary i:before,.faq summary i:after{content:"";position:absolute;background:var(--gold);left:0;right:0;top:7px;height:1.6px}
.faq summary i:after{transform:rotate(90deg);transition:transform .32s var(--ease)}
.faq details[open] summary i{transform:rotate(180deg)}
.faq details[open] summary i:after{transform:rotate(0deg)}
.faq .ans{overflow:hidden}
.faq .ans p{margin:0 0 24px;max-width:72ch;font-size:15.5px;line-height:1.68;color:var(--ink-2)}

/* proof */
.figs{display:flex;gap:46px;flex-wrap:wrap}
.fig{display:flex;flex-direction:column;gap:2px}
.fig b{font-family:Newsreader,serif;font-weight:400;font-size:clamp(42px,4.6vw,60px);line-height:1;color:var(--navy-700);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .fig b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fig b{color:var(--gold)}}
.fig span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:6px}
.ffi{border-left:2px solid var(--gold);padding-left:28px}
.ffi p{font-family:Newsreader,Georgia,serif;font-size:clamp(19px,2vw,24px);line-height:1.4;margin:0 0 12px;color:var(--ink)}
.badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.badge{border:1px solid var(--rule);padding:9px 15px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}

/* insights */
.ins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}
@media (max-width:900px){.ins{grid-template-columns:minmax(0,1fr);gap:30px}}
.art{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit}
.art .ph{overflow:hidden;background:var(--navy-700);aspect-ratio:16/10}
.art .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.art:hover .ph img{transform:scale(1.05)}
.art .eyebrow{color:var(--gold)}
.art h3{font-size:21px;line-height:1.28}
.art .meta{font-size:12.5px;color:var(--ink-3)}
.artlist{display:flex;flex-direction:column}
.artrow{display:flex;flex-direction:column;gap:7px;padding:24px 0;border-top:1px solid var(--rule);text-decoration:none;color:inherit;transition:transform .2s var(--ease)}
.artrow:hover{transform:translateY(-2px)}
.artrow:hover h3{color:var(--gold)}
.artrow h3{font-size:20px;line-height:1.3;transition:color .18s ease-out}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:36px}
.chip{border:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:10px 17px;font:inherit;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:border-color .16s,background .16s,color .16s}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--navy-700);border-color:var(--navy-700);color:#fff}

/* team */
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px}
@media (max-width:1000px){.team{grid-template-columns:repeat(2,minmax(0,1fr))}}
.person{display:flex;flex-direction:column;gap:13px}
.person .ph{aspect-ratio:4/5;background:var(--navy-700);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.person .ph span{color:var(--navy-300);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;text-align:center;padding:0 12px}
.person h3{font-size:17.5px;line-height:1.3}
.person .role{font-size:12.5px;color:var(--ink-3);line-height:1.5}

/* form */
.form{display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.field input,.field select,.field textarea{
  font:inherit;font-size:15px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);padding:14px 15px;min-height:50px;
  transition:border-color .16s ease-out;
}
.field textarea{min-height:118px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.slot{background:var(--paper);padding:30px}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:18px 0 20px}
.time{border:1px solid var(--rule);padding:11px 4px;text-align:center;font-size:12.5px;font-weight:500;cursor:pointer;background:var(--surface);color:var(--ink);font-family:inherit;transition:border-color .16s,background .16s,color .16s}
.time:hover{border-color:var(--gold)}
.time[aria-pressed="true"]{background:var(--navy-700);border-color:var(--navy-700);color:#fff}
.slot .btn{width:100%}
.mapbox{aspect-ratio:16/9;background:var(--navy-700);display:flex;align-items:center;justify-content:center;color:var(--navy-300);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}

/* firm */
.firm img{width:100%;aspect-ratio:5/4;object-fit:cover}

/* book */
.book{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:64px;align-items:center}
@media (max-width:900px){.book{grid-template-columns:minmax(0,1fr);gap:36px}}
.book h2{color:#fff}
.book>div>p{color:#C9D5E6;margin:20px 0 0;font-size:17px;max-width:46ch}
.slot .eyebrow{color:var(--ink-3)}

/* footer */
footer{background:var(--navy-900);color:#fff;padding:64px 0 34px}
.fgrid{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:40px}
@media (max-width:950px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fgrid img{width:200px;margin-bottom:18px}
.fcol{display:flex;flex-direction:column;gap:11px}
.fcol .eyebrow{color:var(--gold);margin-bottom:3px}
.fcol a,.fcol p{color:#A9B8CE;font-size:13.5px;text-decoration:none;margin:0;line-height:1.5}
.fcol a:hover{color:#fff}
.fbot{margin-top:48px;padding-top:22px;border-top:1px solid rgba(143,166,201,.2);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:12.5px;color:#7E93B4}

/* reveal */
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none;transition:opacity .5s ease-out,transform .5s var(--ease)}
.rv.d1{transition-delay:60ms}.rv.d2{transition-delay:120ms}.rv.d3{transition-delay:180ms}
.hero .ln{opacity:0;transform:translateY(18px)}
.ready .hero .ln{opacity:1;transform:none;transition:opacity .46s ease-out,transform .46s var(--ease)}
.ready .hero .ln:nth-child(2){transition-delay:70ms}
.ready .hero .ln:nth-child(3){transition-delay:140ms}
.hero .fade{opacity:0}
.ready .hero .fade{opacity:1;transition:opacity .5s ease-out .24s}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .rv{opacity:1;transform:none}
  .hero .ln,.hero .fade{opacity:1;transform:none}
  .step:before{transform:scaleX(1)}
}
</style>
